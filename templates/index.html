<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guava Disease Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>🍃 Guava Disease Detection</h1>

    <p class="subtitle">
        Upload a guava leaf or fruit image to detect its disease.
    </p>

    <form action="/predict"
          method="POST"
          enctype="multipart/form-data">

        <input
            type="file"
            name="image"
            accept="image/*"
            required>

        <br><br>

        <button type="submit">
            Predict Disease
        </button>

    </form>

</div>

</body>

</html>
