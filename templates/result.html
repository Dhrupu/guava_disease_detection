<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prediction Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>🍃 Prediction Result</h1>

    <img src="{{ url_for('static', filename='uploads/' + image_name) }}"
         class="preview-image"
         alt="Uploaded Image">

    <h2>Disease Detected</h2>

    <div class="disease">
        {{ disease }}
    </div>

    <hr>

    <h2>Confidence</h2>

    <div class="confidence">
        {{ confidence }}%
    </div>

    <a href="/" class="button">
        Predict Another Image
    </a>

</div>

</body>

</html>
